# One-click deploy on Render: New > Blueprint > pick this repository.
services:
  - type: web
    name: finn
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false          # Render asks for it when you create the service.
      - key: FINN_ADMIN_TOKEN
        generateValue: true  # Needed to change AI keys from the browser on a hosted copy.
      - key: LLM_MIN_SECONDS_BETWEEN_CALLS
        value: "5"
